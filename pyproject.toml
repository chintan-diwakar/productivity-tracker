[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-focus-tracker"
version = "0.1.0"
description = "A private, local-first desk focus tracker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cv2-enumerate-cameras==1.3.3",
  "mediapipe==1.0.0",
  "opencv-contrib-python==5.0.0.93",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: X11 Applications",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]
packaging = [
  "pyinstaller==6.21.0",
]
ultralytics-export = [
  "ultralytics>=8.4,<9",
]
onnx = [
  "onnxruntime>=1.20,<2",
]

[project.scripts]
desk-focus = "desk_focus_tracker.cli:main"
desk-focus-engine = "desk_focus_tracker.engine_server:main"

[project.gui-scripts]
desk-focus-app = "desk_focus_tracker.desktop_launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
