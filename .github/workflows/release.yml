name: Build release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 1.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  signing:
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.values.outputs.available }}
    steps:
      - name: Look for the Apple signing values
        id: values
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          available=true
          for value in \
            "$MACOS_CERTIFICATE_BASE64" \
            "$MACOS_CERTIFICATE_PASSWORD" \
            "$APPLE_CODESIGN_IDENTITY" \
            "$APPLE_ID" \
            "$APPLE_TEAM_ID" \
            "$APPLE_APP_PASSWORD"; do
            if [ -z "$value" ]; then
              available=false
            fi
          done
          echo "available=$available" >> "$GITHUB_OUTPUT"
          echo "Apple signing values available: $available"

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libadwaita-1-dev \
            libgl1 \
            libglib2.0-0t64 \
            libgtk-4-dev \
            libsm6 \
            libxext6 \
            libxrender1 \
            xauth \
            xvfb
      - name: Install build dependencies
        run: python -m pip install --upgrade pip ".[dev,packaging]"
      - name: Run the tests
        run: python -m pytest
      - name: Build the Ubuntu package
        run: bash packaging/build_ubuntu.sh
      - name: Make sure that the Ubuntu package starts
        run: |
          (cd dist && sha256sum -c know-your-focus_*.deb.sha256)
          sudo apt-get install --yes ./dist/know-your-focus_*.deb
          python -m know_your_focus download-models
          printf '%s\n%s\n' \
            '{"id":1,"command":"start"}' \
            '{"id":2,"command":"shutdown"}' \
            | /opt/know-your-focus/engine/kyf-engine \
            > /tmp/kyf-engine-smoke.jsonl
          grep -q '"id":1,"ok":true' /tmp/kyf-engine-smoke.jsonl
          grep -q '"id":2,"ok":true' /tmp/kyf-engine-smoke.jsonl
          set +e
          xvfb-run -a timeout 5 /usr/bin/know-your-focus
          app_status=$?
          set -e
          test "$app_status" -eq 124
          test -f "$HOME/.config/know-your-focus/configuration.json"
      - uses: actions/upload-artifact@v7
        with:
          name: ubuntu-package
          path: |
            dist/*.deb
            dist/*.deb.sha256

  macos:
    needs: signing
    if: needs.signing.outputs.available == 'true'
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Install GTK packaging libraries
        run: brew install gtk4 libadwaita dylibbundler
      - name: Install build dependencies
        run: python -m pip install --upgrade pip ".[dev,packaging]"
      - name: Run the tests
        run: python -m pytest
      - name: Install the Apple signing certificate
        run: |
          certificate_path="$RUNNER_TEMP/know-your-focus-certificate.p12"
          keychain_path="$RUNNER_TEMP/know-your-focus-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo -n "$MACOS_CERTIFICATE_BASE64" | base64 --decode -o "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
      - name: Build the macOS package
        run: bash packaging/build_macos.sh
      - name: Make sure that the packaged engine starts
        run: |
          python -m know_your_focus download-models
          printf '%s\n%s\n' \
            '{"id":1,"command":"start"}' \
            '{"id":2,"command":"shutdown"}' \
            | "dist/Know Your Focus.app/Contents/Resources/engine/kyf-engine" \
            > "$RUNNER_TEMP/kyf-engine-smoke.jsonl"
          grep -q '"id":1,"ok":true' "$RUNNER_TEMP/kyf-engine-smoke.jsonl"
          grep -q '"id":2,"ok":true' "$RUNNER_TEMP/kyf-engine-smoke.jsonl"
      - name: Make sure that the macOS checksum matches
        run: (cd dist && shasum -a 256 -c KnowYourFocus-*.dmg.sha256)
      - name: Remove the temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/know-your-focus-signing.keychain-db"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-package
          path: |
            dist/*.dmg
            dist/*.dmg.sha256

  release:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.ubuntu.result == 'success' }}
    needs: [ubuntu, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-package"
          merge-multiple: true
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job downloads artifacts without a checkout, so gh has no git
          # remote to read the repository from.
          GH_REPO: ${{ github.repository }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          if [ "$MACOS_RESULT" = "success" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
            exit 0
          fi
          notes_path="$RUNNER_TEMP/macos-note.md"
          printf '%s\n' \
            'This release contains the Ubuntu package only.' \
            '' \
            'The macOS disk image needs Apple signing credentials. Add the signing secrets, then run this workflow again.' \
            '' \
            > "$notes_path"
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --notes-file "$notes_path"
